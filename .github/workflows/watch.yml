name: watch

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes; the code decides what's due
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run (tick, doctor, profile, list, digest --force, monthly --force, test-email)"
        default: "tick"

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          TRACK_BASE_URL: ${{ vars.TRACK_BASE_URL || 'https://exgnipulpznzhpryznuc.supabase.co/functions/v1/track' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python -m watcher ${{ github.event.inputs.command || 'tick' }}
