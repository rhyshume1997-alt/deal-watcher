# Where deals come from. Add a source by adding an entry here.
#
# kind:
#   deal_feed   - community deal RSS (HotUKDeals). Every post is scored.
#   blog_feed   - editorial RSS (Head for Points, F1 news). Posts are scored; most are travel/finance/F1.
#   page_watch  - fetch a page and alert when watched phrases appear (ticket pages, restocks).
#                 With `find_link`, the page is found by following a link on `listing_url` whose
#                 text matches, so it survives the site changing its URLs.
#   newsletter  - emails from these senders are read (via Gmail) and every concrete deal in them is
#                 scored. Used for sites that block feed readers.
# urls: tried in order until one works (sites move their feeds around).
# interval_min: minimum minutes between checks.
# keywords: for blog feeds, only posts matching at least one keyword are kept.
# keywords_all: a list of keyword groups; a post must match at least one word from EVERY group.
# enabled: false switches a source off without deleting it.

deal_feed:
  - id: hukd_hot
    urls: ["https://www.hotukdeals.com/rss/hot"]
    interval_min: 30
  - id: hukd_new
    urls: ["https://www.hotukdeals.com/rss/new"]
    interval_min: 30
    min_heat: 150            # new posts are noisy; only keep ones the community already likes
  - id: hukd_freebies
    urls: ["https://www.hotukdeals.com/rss/tag/freebies"]
    interval_min: 120

blog_feed:
  - id: headforpoints
    urls: ["https://www.headforpoints.com/feed/"]
    interval_min: 120
    keywords: [amex, american express, avios, british airways, " ba ", reward flight, sale, bonus, offer, companion voucher, lounge]
  - id: insideflyer
    urls: ["https://www.insideflyer.co.uk/feed/"]
    interval_min: 240
    keywords: [amex, american express, avios, british airways, bonus, sale]
  # F1 tickets, presales and hospitality. Only posts that mention tickets AND a sale event count,
  # so race reports don't trigger alerts. (Replaces Google News, whose robots.txt disallows feeds.)
  - id: f1_official
    urls: ["https://www.formula1.com/en/latest/all.xml", "https://www.formula1.com/content/fom-website/en/latest/all.xml"]
    interval_min: 60
    category: f1
    keywords_all: &f1_tickets
      - [ticket, tickets, hospitality, grandstand, general admission, paddock club]
      - [on sale, presale, pre-sale, general sale, released, release, sold out, waiting list, restock, back on sale, available now, early bird]
  - id: f1_racefans
    urls: ["https://www.racefans.net/feed/"]
    interval_min: 60
    category: f1
    keywords_all: *f1_tickets
  - id: f1_autosport
    urls: ["https://www.autosport.com/rss/f1/news/"]
    interval_min: 60
    category: f1
    keywords_all: *f1_tickets
  # Amex Offers are covered by headforpoints and insideflyer above (both keyword-filtered for Amex)
  # plus Amex's own emails, which the Gmail reader picks up.

# MoneySavingExpert blocks feed readers (403), so its weekly email is read instead.
# Sign up once at moneysavingexpert.com/tips (free); nothing else to do.
newsletter:
  - id: mse_email
    senders: [moneysavingexpert.com]

page_watch:
  - id: silverstone_tickets
    url: "https://www.silverstone.co.uk/events/formula-1-british-grand-prix"
    interval_min: 30
    category: f1
    title: Silverstone - British Grand Prix tickets
    alert_on: [on sale now, buy tickets, presale, pre-sale, general sale, waiting list, released, restock, back on sale]
  - id: f1_tickets_gb
    listing_url: "https://tickets.formula1.com/en"
    find_link: [great britain, british grand prix, silverstone]
    interval_min: 30
    category: f1
    title: F1 Tickets - British Grand Prix
    alert_on: [buy now, on sale, presale, pre-sale, sold out, available, waiting list]
